name: EPG Nightly Grab

on:
  schedule:
    - cron: '0 6 * * *'  # Daily 6am UTC
  workflow_dispatch:  # Manual trigger

jobs:
  grab-epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Clone iptv-org/epg SDK
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git /tmp/epg-sdk
          cd /tmp/epg-sdk
          npm install
      
      - name: Filter channels.xml (exclude problematic sites)
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          
          # Sites with known memory leak issues in iptv-org/epg SDK
          EXCLUDED_SITES = {'i.mjh.nz', 'epgshare01.online'}
          
          tree = ET.parse('channels.xml')
          channels = tree.findall('channel')
          
          original_count = len(channels)
          print(f"Original channels: {original_count}")
          
          # Filter out excluded sites
          filtered = [ch for ch in channels if ch.get('site') not in EXCLUDED_SITES]
          excluded = [ch for ch in channels if ch.get('site') in EXCLUDED_SITES]
          
          print(f"Filtered channels: {len(filtered)}")
          print(f"Excluded channels: {len(excluded)}")
          
          for ch in excluded:
              print(f"  EXCLUDED: {ch.get('site')} - {ch.text}")
          
          # Write filtered channels
          root = ET.Element('channels')
          for ch in filtered:
              root.append(ch)
          
          filtered_tree = ET.ElementTree(root)
          ET.indent(filtered_tree, space='  ')
          filtered_tree.write('channels-filtered.xml', encoding='UTF-8', xml_declaration=True)
          
          print(f"✓ channels-filtered.xml created with {len(filtered)} channels")
          EOF
      
      - name: Split channels into batches of 20
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          
          tree = ET.parse('channels-filtered.xml')
          channels = tree.findall('channel')
          
          print(f"Total channels: {len(channels)}")
          
          batch_size = 20
          for i in range(0, len(channels), batch_size):
            batch = channels[i:i+batch_size]
            root = ET.Element('channels')
            root.extend(batch)
            
            batch_num = i // batch_size
            filename = f'channels-batch{batch_num:02d}.xml'
            
            tree = ET.ElementTree(root)
            ET.indent(tree, space='  ')
            tree.write(filename, encoding='UTF-8', xml_declaration=True)
            
            print(f"Created {filename} with {len(batch)} channels")
          EOF
      
      - name: Grab EPG per batch
        run: |
          batch_count=0
          failed_batches=0
          
          for batch_file in channels-batch*.xml; do
            batch_count=$((batch_count + 1))
            echo "============================================"
            echo "Processing batch $batch_count: $batch_file"
            echo "============================================"
            
            cd /tmp/epg-sdk
            
            # Continue even if a batch fails
            if npm run grab -- \
              --channels=$GITHUB_WORKSPACE/$batch_file \
              --output=$GITHUB_WORKSPACE/guide-$batch_file \
              --days=2 \
              --timeout=60000; then
              echo "✓ Batch $batch_count succeeded"
            else
              echo "✗ Batch $batch_count failed (continuing)"
              failed_batches=$((failed_batches + 1))
            fi
            
            cd $GITHUB_WORKSPACE
            sleep 5
          done
          
          echo "============================================"
          echo "Batches processed: $batch_count"
          echo "Failed batches: $failed_batches"
          echo "============================================"
        continue-on-error: true
      
      - name: Merge batch guides into single guide.xml
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          import glob
          
          batch_files = sorted(glob.glob('guide-channels-batch*.xml'))
          print(f"Merging {len(batch_files)} batch files")
          
          tv = ET.Element('tv')
          tv.set('generator-info-name', 'mimenu-epg')
          tv.set('generator-info-url', 'https://github.com/amigocarellc-oss/mimenu-epg-guides')
          
          channels_merged = programmes_merged = 0
          
          for batch_file in batch_files:
            try:
              tree = ET.parse(batch_file)
              root = tree.getroot()
              
              for channel in root.findall('channel'):
                tv.append(channel)
                channels_merged += 1
              
              for programme in root.findall('programme'):
                tv.append(programme)
                programmes_merged += 1
              
              print(f"  Merged {batch_file}")
            except Exception as e:
              print(f"  ERROR merging {batch_file}: {e}")
          
          tree = ET.ElementTree(tv)
          ET.indent(tree, space='  ')
          tree.write('guide.xml', encoding='UTF-8', xml_declaration=True)
          
          print(f"✓ guide.xml: {channels_merged} channels, {programmes_merged} programmes")
          EOF
      
      - name: Verify guide.xml generated
        run: |
          if [ ! -f guide.xml ]; then
            echo "ERROR: guide.xml not generated"
            exit 1
          fi
          echo "guide.xml size: $(wc -c < guide.xml) bytes"
          echo "guide.xml lines: $(wc -l < guide.xml)"
          head -30 guide.xml
      
      - name: Commit and push guide.xml
        run: |
          git config user.name "epg-bot"
          git config user.email "bot@mimenu.pro"
          git add guide.xml
          if git diff --cached --quiet; then
            echo "No changes to guide.xml"
          else
            git commit -m "EPG update $(date -u +%Y-%m-%d)"
            git push
          fi
