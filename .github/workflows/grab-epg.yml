name: EPG Nightly Grab

on:
  schedule:
    - cron: '0 6 * * *'  # Daily 6am UTC
  workflow_dispatch:  # Manual trigger

jobs:
  grab-epg:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Clone iptv-org/epg SDK
        run: |
          git clone --depth 1 https://github.com/iptv-org/epg.git /tmp/epg-sdk
          cd /tmp/epg-sdk
          npm install
      
      - name: Apply memory leak patch
        run: |
          python3 << 'PATCH_EOF'
          from pathlib import Path
          
          config_file = Path("/tmp/epg-sdk/sites/i.mjh.nz/i.mjh.nz.config.js")
          
          with open(config_file, 'r') as f:
              content = f.readlines()
          
          # Backup
          backup = config_file.with_suffix('.js.bak')
          with open(backup, 'w') as f:
              f.writelines(content)
          
          # Apply patches
          patched = []
          api_found = parse_found = False
          
          for line in content:
              patched.append(line)
              
              if not api_found and "const API_ENDPOINT" in line:
                  api_found = True
                  patched.append("\n// PATCH: Global cache to prevent re-parsing same XML\n")
                  patched.append("const parsedContentCache = new Map()\n")
              
              if not parse_found and "parser.parse(content)" in line:
                  parse_found = True
                  patched.pop()  # Remove original line
                  patched.append("    const cacheKey = content.substring(0, 100)\n")
                  patched.append("    let data = parsedContentCache.get(cacheKey)\n")
                  patched.append("    if (!data) {\n")
                  patched.append("      data = parser.parse(content)\n")
                  patched.append("      parsedContentCache.set(cacheKey, data)\n")
                  patched.append("      if (parsedContentCache.size > 50) {\n")
                  patched.append("        const firstKey = parsedContentCache.keys().next().value\n")
                  patched.append("        parsedContentCache.delete(firstKey)\n")
                  patched.append("      }\n")
                  patched.append("    }\n")
          
          with open(config_file, 'w') as f:
              f.writelines(patched)
          
          print(f"✓ Patch applied: API={api_found}, Parse={parse_found}")
          assert api_found and parse_found, "Patch failed"
          PATCH_EOF
      
      - name: Split channels into batches of 10
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          
          tree = ET.parse('channels.xml')
          channels = tree.findall('channel')
          
          print(f"Total channels: {len(channels)}")
          
          batch_size = 10
          for i in range(0, len(channels), batch_size):
            batch = channels[i:i+batch_size]
            root = ET.Element('channels')
            root.extend(batch)
            
            batch_num = i // batch_size
            filename = f'channels-batch{batch_num:02d}.xml'
            
            tree = ET.ElementTree(root)
            ET.indent(tree, space='  ')
            tree.write(filename, encoding='UTF-8', xml_declaration=True)
            
            print(f"Created {filename} with {len(batch)} channels")
          EOF
      
      - name: Grab EPG per batch with sleep
        run: |
          batch_count=0
          for batch_file in channels-batch*.xml; do
            batch_count=$((batch_count + 1))
            echo "Processing batch $batch_count: $batch_file"
            
            cd /tmp/epg-sdk
            npm run grab -- \
              --channels=$GITHUB_WORKSPACE/$batch_file \
              --output=$GITHUB_WORKSPACE/guide-$batch_file \
              --days=1 \
              --timeout=60000
            
            echo "Batch $batch_count complete. Sleeping 10s to force GC..."
            sleep 10
          done
          
          echo "All batches processed: $batch_count"
      
      - name: Merge batch guides into single guide.xml
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          import glob
          
          batch_files = sorted(glob.glob('guide-channels-batch*.xml'))
          print(f"Merging {len(batch_files)} batch files")
          
          tv = ET.Element('tv')
          tv.set('generator-info-name', 'mimenu-epg-batched')
          tv.set('generator-info-url', 'https://github.com/amigocarellc-oss/mimenu-epg-guides')
          
          channels_merged = programmes_merged = 0
          
          for batch_file in batch_files:
            try:
              tree = ET.parse(batch_file)
              root = tree.getroot()
              
              for channel in root.findall('channel'):
                tv.append(channel)
                channels_merged += 1
              
              for programme in root.findall('programme'):
                tv.append(programme)
                programmes_merged += 1
              
              print(f"Merged {batch_file}")
            except Exception as e:
              print(f"ERROR merging {batch_file}: {e}")
          
          tree = ET.ElementTree(tv)
          ET.indent(tree, space='  ')
          tree.write('guide.xml', encoding='UTF-8', xml_declaration=True)
          
          print(f"✓ guide.xml: {channels_merged} channels, {programmes_merged} programmes")
          EOF
      
      - name: Verify guide.xml generated
        run: |
          if [ ! -f guide.xml ]; then
            echo "ERROR: guide.xml not generated"
            exit 1
          fi
          echo "guide.xml size: $(wc -c < guide.xml) bytes"
          echo "guide.xml lines: $(wc -l < guide.xml)"
          head -50 guide.xml
      
      - name: Commit and push guide.xml
        run: |
          git config user.name "epg-bot"
          git config user.email "bot@mimenu.pro"
          git add guide.xml
          if git diff --cached --quiet; then
            echo "No changes to guide.xml"
          else
            git commit -m "EPG update $(date -u +%Y-%m-%d) - patched SDK"
            git push
          fi
